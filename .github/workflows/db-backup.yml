# Audit 2026-11 D-1 stopgap: the Supabase Free plan has no restorable
# backups. This takes a weekly encrypted dump of the database and keeps it
# as a GitHub Actions artifact for 90 days. It is NOT a replacement for
# Supabase Pro's daily backups / point-in-time recovery - just a way to
# not lose everything in the meantime.
#
# Needs two repository secrets (Settings -> Secrets and variables ->
# Actions):
#   SUPABASE_DB_URL    Supabase -> Connect -> Session pooler connection
#                      string, with the database password filled in.
#                      (The direct connection is IPv6-only, which GitHub's
#                      runners can't reach.)
#   BACKUP_PASSPHRASE  Long random passphrase. Keep it in a password
#                      manager - the backups can't be decrypted without it.
#
# Restore, from a downloaded artifact:
#   gpg --decrypt ocl-db-<date>.tar.gz.gpg > ocl-db.tar.gz
#   tar -xzf ocl-db.tar.gz
#   psql "<target connection string>" -f public.sql
#   psql "<target connection string>" -f auth_users.sql
# (Restore into a fresh project; public.sql recreates tables, functions,
# policies and data in the public schema; auth_users.sql restores the
# admin login accounts.)
#
# Note: GitHub disables scheduled workflows in a repo with no commits for
# 60 days. Re-enable it from the Actions tab if that happens.
name: DB backup

on:
  schedule:
    # Sundays 18:00 UTC = Monday 02:00 SGT.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pg_dump 17 (matches the Supabase server version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets must both be set." >&2
            exit 1
          fi
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p dump
          "$PG_DUMP" "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges \
            --file=dump/public.sql
          "$PG_DUMP" "$SUPABASE_DB_URL" --data-only --table=auth.users --table=auth.identities \
            --file=dump/auth_users.sql
          tar -czf "ocl-db-${STAMP}.tar.gz" -C dump .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "ocl-db-${STAMP}.tar.gz.gpg" \
            "ocl-db-${STAMP}.tar.gz"
          rm -rf dump "ocl-db-${STAMP}.tar.gz"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ocl-db-${{ env.STAMP }}
          path: ocl-db-${{ env.STAMP }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
